# Keeps the Go module and the workflows' pinned actions current. The
# Dockerfile is deliberately absent: it pulls from dhi.io, which needs
# registry credentials Dependabot does not have here, so a docker
# ecosystem entry would only produce failures.
version: 2

updates:
  # One module lives here, at the repository root, with the /v3 major
  # suffix in its path.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

    # Matches the conventional prefixes the history uses (fix(tck),
    # feat(spec), chore(examples)), so a dependency bump reads like every
    # other commit rather than like a robot arrived.
    commit-message:
      prefix: chore(deps)

    # Minor and patch bumps arrive as one pull request. Two reasons: the
    # conformance suite is the expensive part of CI and runs per pull
    # request, and buildkit brings a large indirect tree whose bumps are
    # individually unreviewable — a single diff of go.mod and go.sum is
    # what a reviewer can actually read.
    #
    # A major is deliberately left out of the group, so it arrives alone.
    # Those are the ones that change behavior this repository depends on:
    # the frontend is built against buildkit's gateway API, and the kit
    # suite reads registries through oras.
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Every action in the three workflows is pinned to a commit SHA, which
  # is the right way to consume one and also the reason a human will
  # never update them: nothing about `@3d3c42e5` says it is behind. This
  # is the entry that reads the comment beside the pin and moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # Grouped wholesale rather than by update type. An action's major is
    # not a semantic claim about this repository the way a library's is —
    # it changes inputs a workflow passes, which CI either accepts or
    # does not, and finding that out one pull request at a time for
    # twenty-six pins is noise rather than diligence.
    groups:
      github-actions:
        patterns:
          - "*"
