name: frontend

on:
  push:
    branches: [main]

# Build and push the BuildKit frontend on every main commit as
# docker/sandbox-kit:<short-sha>. Does not move floating :3 — that is
# only the stable v3.y.z release path. Hub OIDC is required; set
# DOCKERHUB_ORGANIZATION and DOCKERHUB_OIDC_CONNECTIONID.
permissions:
  contents: read

jobs:
  build:
    name: build and push frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Default is 300s; multi-arch QEMU builds often exceed that before push.
          DOCKERHUB_OIDC_EXPIREIN: "7200"
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Push frontend
        run: |
          short_sha=$(printf '%.7s' "${GITHUB_SHA}")
          FRONTEND_PUSH_OK=1 task frontend:push FRONTEND_VERSION="$short_sha"
