name: release

on:
  push:
    tags:
      # Schema/frontend release line (Hub docker/sandbox-kit:3.y.z + kit-tck
      # binaries). Not a Go module major — see RELEASES.md. Module consumers
      # keep using v0.* / v1.* tags.
      - "v3.*"

# Publishes kit-tck via GoReleaser and the BuildKit frontend image to Hub.
# Hub login uses Docker OIDC (no long-lived PAT): set repo variables
# DOCKERHUB_ORGANIZATION and DOCKERHUB_OIDC_CONNECTIONID, and create the
# Hub repo docker/sandbox-kit before the first tag.
permissions:
  contents: read

jobs:
  release:
    name: release kit-tck and frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate
        run: task validate

      - name: Lint
        run: task lint

      - name: Unit tests
        run: task test:unit

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Push frontend image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          promote=
          # Floating :3 only when this stable tag is the highest v3.X.Y on
          # the remote — reruns of older stables must not regress it.
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            highest=$(git tag -l 'v3.*.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [ "v${version}" = "$highest" ]; then
              promote=1
            fi
          fi
          FRONTEND_PUSH_OK=1 FRONTEND_PROMOTE_MAJOR="$promote" \
            task frontend:push FRONTEND_VERSION="$version"
