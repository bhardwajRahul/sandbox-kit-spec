# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Bounded SSH agent
description: Grants git signatures and logins as git to the suite's test server only, so the relay enforcing each bound is observable
capabilities:
  - type: com.docker.sandbox/ssh-agent@1
    config:
      phase: runtime
      unrestricted: false
      sign: [git]
      # A name the suite hands the runtime host keys for through
      # --ssh-known-hosts; .example is reserved, so no real server answers.
      authenticate: [git@kit-tck.example]
