# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Sandbox platform workload
description: >-
  A workload declaring sbx@1 whose identity is deliberately not the
  conventional one, so a runtime that assumes an identity instead of
  reading the image's is caught rather than accidentally right.
provides: ["kit-tck-sbx-workload@1.0.0"]

capabilities:
  - type: com.docker.sandbox/sbx@1
