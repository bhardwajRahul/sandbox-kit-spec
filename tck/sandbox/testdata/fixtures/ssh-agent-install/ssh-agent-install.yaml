# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Install-phase SSH agent
description: Grants an SSH agent to install hooks only, so the grant reaching install and ending before the workload are both observable
capabilities:
  - type: com.docker.sandbox/ssh-agent@1
    config:
      phase: install
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command: >-
            sh -c 'printf "%s" "$SSH_AUTH_SOCK" > /var/tmp/ssh-agent-install-sock;
            kit-tck-ssh-agent observe > /var/tmp/ssh-agent-at-install 2>&1 || true'
          env: [SSH_AUTH_SOCK]
          description: Records the identities the agent offered during install, so the install grant is observable before its end is
