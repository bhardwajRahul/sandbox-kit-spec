# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Image environment file
description: Expands an image default without any Kit argument exports
# No args: even a default argument export would mask the image value.
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: '${{ kit.env.HOME }}/.config/env-written'
          content: '${{ kit.env.KIT_GREETING }}'
