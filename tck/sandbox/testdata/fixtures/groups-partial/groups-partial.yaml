# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
capabilities:
  - group:
      optional: true
      capabilities:
        - type: com.docker.sandbox/volume@1
          config: {path: /var/tmp/group-volume}
        - type: com.docker.sandbox/lifecycle@1
          config:
            files:
              - {path: /var/tmp/group-feature, content: selected}
