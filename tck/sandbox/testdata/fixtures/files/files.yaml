# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Declared file
description: Writes a file whose content comes from an arg, so expansion is observable
args:
  greeting:
    # Deliberately not the value the check passes: a runtime that
    # ignored --arg would otherwise pass by using the default.
    default: unset
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # On the agent's write surface, which is where a declared file
        # belongs: this capability grants no permission surface, so files
        # are written as the agent user on the entrypoint's trust plane.
        # A root-owned path would need an install hook saying so.
        - path: /home/agent/.config/kit-written
          content: '${{ kit.args.greeting }}'
