# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Writable agent skills
description: Asks for write access, so the other half of the access bound is observable
capabilities:
  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.kit-tck/skills-rw
      mode: readwrite
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command: sh -c 'ls /home/agent/.kit-tck/skills-rw > /var/tmp/skills-rw-at-install 2>&1 || true'
          description: Records what this mount held during install, so a runtime mounting later declarations after hooks is visible
