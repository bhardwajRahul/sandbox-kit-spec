# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
args:
  group_path:
    default: /var/tmp/group-expanded
  env_group_path:
    default: /var/tmp/env-group-expanded
    env: KIT_GROUP_PATH
capabilities:
  - group:
      optional: true
      capabilities:
        - type: com.docker.sandbox/lifecycle@1
          config:
            files:
              - path: "${{ kit.args.group_path }}"
                content: selected
              - path: "${{ kit.env.KIT_GROUP_PATH }}"
                content: selected from environment
