# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Shared-path agent skills
description: Names the same path as the skills fixture with a wider mode, so composition's widest-mode rule is observable
capabilities:
  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.kit-tck/skills
      mode: readwrite
