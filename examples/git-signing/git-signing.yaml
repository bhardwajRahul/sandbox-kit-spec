# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Git commit signing
description: >-
  Signs the agent's git commits and tags with the user's SSH key, through
  the SSH agent the runtime exposes. The agent may make git signatures and
  nothing else: no logins, no other namespaces, and no network.

kind: mixin
provides: ["git-signing@1.0.0"]
version: "1.0.0"

capabilities:
  # Git's SSH signing makes namespaced signatures in the namespace `git`
  # and nothing else, so that is the whole grant: the key cannot log in
  # anywhere or sign in another namespace from this sandbox. Signing is
  # enabled below, so creation requires an agent.
  - type: com.docker.sandbox/ssh-agent@1
    description: Sign git commits and tags with the user's SSH key
    config:
      phase: runtime
      unrestricted: false
      sign: [git]

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # git reads ~/.config/git/config before ~/.gitconfig, so the
        # user's own settings still win. defaultKeyCommand asks the agent
        # for its first key at commit time: no key or key path is baked
        # into the kit.
        - path: /home/agent/.config/git/config
          overwrite: false
          description: Sign commits and tags with the agent's key
          content: |
            [gpg]
            	format = ssh
            [gpg "ssh"]
            	defaultKeyCommand = ssh-add -L
            [commit]
            	gpgsign = true
            [tag]
            	gpgsign = true

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./git-signing-context.md
