# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Shell
author: "Docker, Inc."
description: >-
  A plain shell sandbox on the shell-docker template — bash, git, apt, Docker,
  plus common CLI tooling (curl, gh, jq, make, gcc, Python, Node). The base
  workload agent mixins layer onto; it ships no agent and declares no
  credentials.
sourceUrl: https://github.com/docker/sandbox-kit-spec

kind: workload
version: "1.0.0"

# High-level tools from the template image/SBOM (not a full package dump).
provides:
  - bash
  - curl
  - openssl
  - ca-certificates
  - apt
  - docker
  - python3
  - pip
  - node
  - npm
  - jq
  - make
  - gcc

capabilities:
  # Apt sources on shell-docker (Debian trixie / DHI):
  #   deb.debian.org/debian, deb.debian.org/debian-security, dhi.io/deb/...
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - deb.debian.org
          - dhi.io

  # The workload owns the context-file profile; composed mixins fan their
  # guidance out beside it.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      content: |
        This is a plain shell sandbox on the shell-docker template: bash,
        git, apt, Docker (compose/buildx), curl, gh, jq, make, gcc,
        Python 3, and Node/npm. Install more with apt; composed kits list
        their own capabilities below.
